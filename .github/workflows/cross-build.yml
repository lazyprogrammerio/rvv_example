name: cross-build-llamacpp

# Cross-builds llama.cpp (Vulkan backend) for the HiFive Unmatched
# (riscv64, SiFive U74, Ubuntu + amdgpu/Mesa RADV) on an x86-64 runner.
# Nothing is built on the board; see ci/build-llamacpp.sh and README.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT: llamacpp-riscv64-unmatched

jobs:
  build:
    name: cross-build (riscv64, Vulkan)
    # Pinned to 24.04: Ubuntu 25.10+ riscv64 toolchains (and their static
    # libstdc++/libgcc) target RVA23, which the Unmatched's U74 cannot run.
    # 24.04's toolchain targets rv64gc and its glibc 2.39 matches the board.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cross-build llama.cpp + Vulkan loader
        run: ci/build-llamacpp.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/${{ env.ARTIFACT }}.tar.gz
          if-no-files-found: error

  # Proves the riscv64 binaries load and execute under user-mode emulation
  # of a SiFive U54 (same RV64GC ISA as the Unmatched's U74), so any
  # instruction the board lacks raises SIGILL here too. A tiny model is run
  # on the CPU backend. GPU inference cannot be tested here: there is no AMD
  # GPU (or any Vulkan ICD) on the runner, so Vulkan finds no devices. RADV/RX 580 must be
  # checked on the board (vulkaninfo --summary, then llama-cli -ngl 99).
  smoke-test:
    name: smoke test (qemu-riscv64)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}

      - name: Install qemu-user-static, binfmt-support and riscv64 runtime libs
        run: |
          sudo apt-get update
          # From Ubuntu 26.04 qemu-user-static is a virtual package provided by qemu-user-binfmt.
          qemu=qemu-user-static
          apt-cache policy "$qemu" | grep -q 'Candidate: [0-9]' || qemu=qemu-user-binfmt
          sudo apt-get install -y "$qemu" binfmt-support \
            libc6-riscv64-cross libstdc++6-riscv64-cross libgcc-s1-riscv64-cross

      - name: Run the tools under qemu-riscv64 -cpu sifive-u54
        env:
          # Where qemu finds the riscv64 dynamic linker and libc.
          QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
          # RV64GC only, like the U74 (qemu's default CPU accepts everything).
          QEMU_CPU: sifive-u54
          MODEL_URL: https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
        run: |
          tar -xzf "$ARTIFACT.tar.gz"
          cd "$ARTIFACT"
          file bin/llama-cli
          # The board normally provides libvulkan.so.1; here use the bundled fallback.
          export LD_LIBRARY_PATH="$PWD/lib:$PWD/lib/vulkan-fallback"
          # Executed directly: binfmt_misc hands the riscv64 ELF to qemu-riscv64.
          ./bin/llama-cli --version
          ./bin/llama-server --version
          # --help exit codes differ between tools; just check they ran and printed usage.
          for tool in llama-quantize llama-bench; do
            ./bin/$tool --help > "$RUNNER_TEMP/$tool.txt" 2>&1 || true
            grep -qi usage "$RUNNER_TEMP/$tool.txt" || { cat "$RUNNER_TEMP/$tool.txt"; exit 1; }
            echo "$tool: OK"
          done
          # CPU-only inference with a 1 MB model (Vulkan finds no device here).
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/model.gguf" "$MODEL_URL"
          ./bin/llama-bench -m "$RUNNER_TEMP/model.gguf" -p 16 -n 16 -r 1 -t 2
          ./bin/llama-cli -m "$RUNNER_TEMP/model.gguf" -st -p "Once upon a time" -n 16 -t 2 < /dev/null

  release:
    name: publish release asset
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}

      - name: Upload tarball to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "llama.cpp (Vulkan) for HiFive Unmatched, cross-built for riscv64."
          gh release upload "$TAG" "$ARTIFACT.tar.gz" --clobber
